services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - resume_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

  preview:
    build:
      context: .
      target: preview
    ports:
      - "8080:80"

  test:
    build:
      context: .
      target: test
    command: npm run check

  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      - preview
    environment:
      PLAYWRIGHT_BASE_URL: http://preview:80
    command: npm run test:e2e

volumes:
  resume_node_modules:
